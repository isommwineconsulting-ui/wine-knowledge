name: Candidate validation
on:
  push:
    branches:
      - audit-remediation/**
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Compile Python sources
        run: python -m compileall -q wine_knowledge tests
      - name: Run offline and security contract tests
        run: python -m pytest -q
